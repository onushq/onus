name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line. Sign off with: git rebase --signoff $BASE"
              missing=1
            fi
          done
          exit $missing
