[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/onushq/onus"
homepage = "https://onushq.com"
authors = ["The Onus contributors"]

[workspace.dependencies]
onus-core = { path = "crates/onus-core", version = "0.6.0" }
onus-lang-lsp = { path = "crates/onus-lang-lsp", version = "0.6.0" }
onus-lang-scip = { path = "crates/onus-lang-scip", version = "0.6.0" }
onus-lang-ts = { path = "crates/onus-lang-ts", version = "0.6.0" }
onus-map = { path = "crates/onus-map", version = "0.6.0" }
onus-diff = { path = "crates/onus-diff", version = "0.6.0" }
onus-report = { path = "crates/onus-report", version = "0.6.0" }
onus-index = { path = "crates/onus-index", version = "0.6.0" }
onus-doors = { path = "crates/onus-doors", version = "0.6.0" }

anyhow = "1.0.100"
biscuit-auth = "6"
clap = { version = "4.6", features = ["derive", "env"] }
globset = "0.4.20"
ignore = "0.4.33"
rayon = "1.12"
regex = "1.13"
schemars = "1.2"
scip = "0.10"
protobuf = "=3.7.2"
lsp-types = "0.97"
url = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
similar = "3.2"
tar = "0.4"
thiserror = "2.0"
tree-sitter = "0.27"
tree-sitter-typescript = "0.23.2"

insta = { version = "1.49", features = ["json", "yaml"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
