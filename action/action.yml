name: Onus report
description: Report the changes in meaning of a pull request, as a sticky comment and a job summary.

# Events:
# - pull_request: report on the change (and keep the comment up to date);
#   with records, classify it with its agent's track record and, when it
#   closes, record the outcome. With records, a change in the human lane
#   fails the job until a review counts (wait-for-review); onus decides from
#   the pull request's reviews, which the action fetches.
# - pull_request_review: the same as a push, so an approval (or a dismissal)
#   updates the lane, the comment and the check.
# - issue_comment: acknowledge `/onus caught <note>`; with records, act on
#   `/onus approve`, `/onus audit` and `/onus incident`, record `/onus caught`
#   from people with write access, and answer `/onus accuracy` (which records
#   nothing).
# - push (to the default branch), with records: record reverts.
# - deployment_status or workflow_dispatch, with records and rollout-percent:
#   a deploy reached a share of production traffic. `onus ci rollout` decides
#   promote, hold, rollback or complete from the change's rollout plan and the
#   samples in rollout-metrics, records the stage, and sets rollout-decision.
#   A rollback fails the step; the deploy workflow acts on it. Onus never
#   moves traffic.
# See `onus help ci` and `onus help production`.
author: Onus
branding:
  icon: eye
  color: gray-dark

inputs:
  version:
    description: >-
      The Onus release to download, such as v0.1.0. Defaults to the ref this
      action was used at when that is a release tag (onushq/onus/action@v0.1.0),
      otherwise the latest release.
    required: false
    default: ""
  onus-path:
    description: Use this onus binary instead of downloading one.
    required: false
    default: ""
  base:
    description: The commit before the change (default the pull request's base commit).
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: The commit after the change (default the pull request's head commit).
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  intent:
    description: >-
      Check the change against the intent stated in the pull request body
      (an onus-intent block). Set to false to skip, or to a file path to use
      that file instead.
    required: false
    default: "true"
  fail-on:
    description: >-
      Fail the job when this is found, comma separated (rule-violation, secrets, behavior;
      behavior needs the behavior input).
    required: false
    default: none
  comment:
    description: Post the report as a pull request comment, updated in place on each push.
    required: false
    default: "true"
  config:
    description: Use this onus.yaml for both commits (default the base commit's).
    required: false
    default: ""
  lanes:
    description: >-
      'true' to classify the change into a risk lane (auto-merge, judge, human, blocked) with the
      policy in onus.yaml and the hard floors, and show the lane and why in the report.
    required: false
    default: 'false'
  apply-lane:
    description: >-
      'true' (with lanes) to label the pull request onus/lane:<lane> and fail the job for the
      blocked lane. Needs issues: write.
    required: false
    default: 'false'
  auto-merge:
    description: >-
      'true' (with lanes) to enable GitHub's auto-merge (squash) when the lane is auto-merge.
      Required checks still apply. Needs contents: write and pull-requests: write.
    required: false
    default: 'false'
  records:
    description: >-
      'true' to keep outcome records on a branch of the repository (records-branch): each pull
      request is classified with its agent's track record, its outcome is recorded when it closes,
      reverts are recorded on pushes to the default branch, and people record approvals, audits and
      incidents with /onus comments. A change in the human lane waits for a review
      (wait-for-review). Implies lanes. Needs contents: write (and actions: write to re-run the check
      after an approving review or /onus approve). See `onus help ci`.
    required: false
    default: 'false'
  records-branch:
    description: The branch that holds the records.
    required: false
    default: onus/records
  wait-for-review:
    description: >-
      'true' (with records) to fail the job while the change is in the human lane and no review
      counts yet: an approval of the head commit by an owner of what changed (lanes.approval in
      onus.yaml), with no changes requested. Add pull_request_review to the workflow's events so an
      approval updates the check. See `onus help ci`.
    required: false
    default: 'true'
  judge:
    description: >-
      'true' (with records) to run the verifying judge when the lane is judge: it re-runs the
      evidence in containers and runs the held-out checks (see held-out). Needs Docker, which
      GitHub's Linux runners have.
    required: false
    default: 'false'
  held-out:
    description: >-
      A directory outside the working directory holding a held-out suite (held-out.yaml and its
      tests), for example cloned from a private repository with its own token into $RUNNER_TEMP.
      Passed to onus ci pr --held-out.
    required: false
    default: ''
  evidence:
    description: >-
      Test runs to submit as evidence, as a glob of JSON files from onus run-test or onus env run
      made earlier in the job (with records). The report also reads the coverage that runs from
      onus env run recorded at the head commit.
    required: false
    default: ''
  coverage:
    description: >-
      Coverage of the head commit (lcov, Cobertura XML or Istanbul JSON) written by an earlier
      step, as a glob. Check out the pull request's head commit for that step
      (actions/checkout with ref: github.event.pull_request.head.sha); coverage measured at
      another commit is left out.
    required: false
    default: ''
  behavior:
    description: >-
      Run the behavior diff: the tests that reach the change run at the base and at the head in
      containers (environment.behavior in the base commit's onus.yaml), and what changed becomes
      rows. Needs Docker, which GitHub's Linux runners have.
    required: false
    default: 'false'
  behavior-budget:
    description: Seconds for the behavior diff, environments included. Default the config's, else 600.
    required: false
    default: ''
  rollout-percent:
    description: >-
      With records, on deployment_status or workflow_dispatch: the share of production traffic the
      deploy reached. Runs only the rollout step (onus ci rollout); see `onus help production`.
    required: false
    default: ''
  rollout-change:
    description: >-
      The change being rolled out: owner/repo#123, or a commit. Default the deployment's commit
      (github.sha).
    required: false
    default: ''
  rollout-metrics:
    description: >-
      A JSON file of the stage's metric samples (schemas/rollout-metrics.schema.json), written by an
      earlier step of the job.
    required: false
    default: ''
  plugins:
    description: >-
      A plugins file's contents (YAML), for example the Svelte plugin that ships with Onus:
      "plugins: [{ name: svelte, kind: language, command: [onus-plugin-svelte], files: ['**/*.svelte'] }]".
      It is written outside the repository and passed with --plugins; Onus never reads plugins from
      the analyzed repository.
    required: false
    default: ''
  working-directory:
    description: The git repository to analyze.
    required: false
    default: "."
  cache:
    description: >-
      Keep the base commit's map in the Actions cache, so later pushes to the
      pull request skip mapping the base again.
    required: false
    default: "true"
  feedback:
    description: >-
      End the comment with a line asking for a 👍 or 👎 reaction and for
      `/onus caught <note>` replies, the Phase 1 usefulness measures.
    required: false
    default: "true"
  github-token:
    description: Token for downloading the release and commenting (needs pull-requests write to comment).
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: Path of the JSON report (schemas/semantic-report.schema.json).
    value: ${{ steps.report.outputs.report }}
  markdown:
    description: Path of the Markdown report.
    value: ${{ steps.report.outputs.markdown }}
  meaning-changes:
    description: Number of meaning-level changes.
    value: ${{ steps.report.outputs.meaning-changes }}
  needs-attention:
    description: Number of changes that need a person to look.
    value: ${{ steps.report.outputs.needs-attention }}
  lane:
    description: The change's risk lane when lanes is 'true'.
    value: ${{ steps.lane.outputs.lane }}
  review:
    description: >-
      With records, in the human lane: 'approved' when a review counts, 'waiting' when none does
      yet. Empty in other lanes.
    value: ${{ steps.lane.outputs.review }}
  provenance:
    description: >-
      Path of the change's provenance record with records 'true'
      (schemas/provenance.schema.json): written while the pull request is
      open, and rebuilt when it closes.
    value: ${{ steps.outcome.outputs.provenance || steps.lane.outputs.provenance }}
  metrics:
    description: >-
      One line of JSON about this report (sizes, counts, time taken), also
      kept in the comment for `scripts/onus-metrics.sh`.
    value: ${{ steps.report.outputs.metrics }}
  rollout-strategy:
    description: The rollout strategy for the change's lane with records 'true' (none, canary or flag).
    value: ${{ steps.lane.outputs.rollout-strategy }}
  rollout-plan:
    description: Path of the change's rollout plan with records 'true' (`onus help production`).
    value: ${{ steps.lane.outputs.rollout-plan }}
  rollout-decision:
    description: >-
      Onus's decision on a rollout stage (promote, hold, rollback or complete), with
      rollout-percent.
    value: ${{ steps.rollout.outputs.rollout-decision }}

runs:
  using: composite
  steps:
    - name: Acknowledge /onus caught
      if: github.event_name == 'issue_comment'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        COMMENT_ID: ${{ github.event.comment.id }}
        IS_PR: ${{ github.event.issue.pull_request != null }}
        AUTHOR_TYPE: ${{ github.event.comment.user.type }}
        # Through the environment, never pasted into the script.
        BODY: ${{ github.event.comment.body }}
      run: |
        set -euo pipefail
        case "$BODY" in
          "/onus caught"*) ;;
          *) echo "Not an /onus caught comment; nothing to do."; exit 0 ;;
        esac
        if [ "$IS_PR" != true ] || [ "$AUTHOR_TYPE" = Bot ]; then
          echo "Only people's comments on pull requests count; nothing to do."
          exit 0
        fi
        gh api --method POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
          -f content=rocket > /dev/null
        echo "Recorded. scripts/onus-metrics.sh counts it from the comment itself."

    - name: Install onus
      id: install
      if: >-
        ((github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && (github.event.action != 'closed' || inputs.records == 'true')) ||
        (inputs.records == 'true' && inputs.rollout-percent != '') ||
        (inputs.records == 'true' && (github.event_name == 'push' ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/onus'))))
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PATH: ${{ inputs.onus-path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        found() {
          "$1" --version
          echo "onus=$1" >> "$GITHUB_OUTPUT"
          echo "version=$("$1" --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
        }
        if [ -n "$INPUT_PATH" ]; then
          found "$(cd "$(dirname "$INPUT_PATH")" && pwd)/$(basename "$INPUT_PATH")"
          exit 0
        fi
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          case "$ACTION_REF" in v[0-9]*) version="$ACTION_REF" ;; *) version=latest ;; esac
        fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=x86_64-unknown-linux-musl ;;
          Linux/ARM64) target=aarch64-unknown-linux-musl ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          macOS/X64) target=x86_64-apple-darwin ;;
          Windows/X64) target=x86_64-pc-windows-msvc ;;
          *) echo "::error::No Onus release for $RUNNER_OS/$RUNNER_ARCH; build it and pass onus-path"; exit 1 ;;
        esac
        ext=tar.gz; exe=""
        if [ "$RUNNER_OS" = Windows ]; then ext=zip; exe=.exe; fi
        asset="onus-$target.$ext"
        dir="$RUNNER_TEMP/onus-$version-$target"
        mkdir -p "$dir"
        tag_args=()
        [ "$version" != latest ] && tag_args=("$version")
        gh release download ${tag_args[@]+"${tag_args[@]}"} --repo onushq/onus \
          --pattern "$asset" --pattern "$asset.sha256" --dir "$dir" --clobber
        want=$(cut -d' ' -f1 < "$dir/$asset.sha256")
        if command -v sha256sum > /dev/null; then
          got=$(sha256sum "$dir/$asset" | cut -d' ' -f1)
        else
          got=$(shasum -a 256 "$dir/$asset" | cut -d' ' -f1)
        fi
        if [ "$want" != "$got" ]; then
          echo "::error::Checksum mismatch for $asset: expected $want, got $got"
          exit 1
        fi
        if [ "$ext" = zip ]; then
          (cd "$dir" && 7z x -y "$asset" > /dev/null)
        else
          tar -xzf "$dir/$asset" -C "$dir"
        fi
        found "$dir/onus-$target/onus$exe"
        echo "$dir/onus-$target" >> "$GITHUB_PATH"

    - name: Restore the base map
      if: (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && github.event.action != 'closed' && inputs.cache == 'true' && inputs.base != ''
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/onus-map-cache
        # One entry per base commit and Onus version. Inside it, each map's
        # file name also covers the config and plugins, so a changed config
        # never reuses a stale map.
        key: onus-map-${{ runner.os }}-${{ steps.install.outputs.version }}-${{ inputs.base }}

    - name: Report
      id: report
      if: (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && github.event.action != 'closed'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ONUS: ${{ steps.install.outputs.onus }}
        VERSION: ${{ steps.install.outputs.version }}
        CACHE: ${{ inputs.cache }}
        CACHE_DIR: ${{ runner.temp }}/onus-map-cache
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        INTENT: ${{ inputs.intent }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG: ${{ inputs.config }}
        PLUGINS: ${{ inputs.plugins }}
        RECORDS: ${{ inputs.records }}
        RECORDS_BRANCH: ${{ inputs.records-branch }}
        COVERAGE: ${{ inputs.coverage }}
        EVIDENCE: ${{ inputs.evidence }}
        BEHAVIOR: ${{ inputs.behavior }}
        BEHAVIOR_BUDGET: ${{ inputs.behavior-budget }}
        # Passed through the environment, never pasted into the script, so a
        # pull request body cannot inject commands.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
          echo "::error::No base or head commit. Run on pull_request, or set the base and head inputs."
          exit 1
        fi
        for ref in "$BASE" "$HEAD"; do
          if ! git cat-file -e "$ref^{commit}" 2> /dev/null; then
            git fetch --no-tags --depth=1 origin "$ref"
          fi
        done
        out="$RUNNER_TEMP/onus"
        mkdir -p "$out"
        args=(--base "$BASE" --head "$HEAD")
        case "$INTENT" in
          true)
            if [ -n "$PR_BODY" ]; then
              printf '%s' "$PR_BODY" > "$out/pr-body.md"
              args+=(--intent "$out/pr-body.md")
            fi
            ;;
          false | "") ;;
          *) args+=(--intent "$INTENT") ;;
        esac
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        if [ -n "$PLUGINS" ]; then
          printf '%s\n' "$PLUGINS" > "$out/plugins.yaml"
          args+=(--plugins "$out/plugins.yaml")
        fi
        # Releases before 0.2 have no map cache.
        if [ "$CACHE" = true ] && "$ONUS" report --help | grep -q -- --cache-dir; then
          args+=(--cache-dir "$CACHE_DIR")
        fi
        # With records, production traces kept in them join the map; the lane
        # step reuses the folder.
        if [ "$RECORDS" = true ] && "$ONUS" signals --help > /dev/null 2>&1; then
          "$ONUS" ci records pull --dir "$RUNNER_TEMP/onus-records" --branch "$RECORDS_BRANCH"
          if [ -s "$RUNNER_TEMP/onus-records/signals.jsonl" ]; then
            args+=(--traces "$RUNNER_TEMP/onus-records/signals.jsonl")
          fi
        fi
        # Coverage belongs to the commit the tests ran at: only the head's counts.
        if [ -n "$COVERAGE" ] && "$ONUS" report --help | grep -q -- --coverage; then
          checkout=$(git rev-parse HEAD)
          if [ "$checkout" = "$(git rev-parse "$HEAD^{commit}")" ]; then
            shopt -s nullglob globstar
            for f in $COVERAGE; do args+=(--coverage "$f"); done
            shopt -u nullglob globstar
          else
            echo "::warning::The checkout is $checkout, not the head commit $HEAD; coverage is left out."
          fi
        fi
        # Runs from onus env run: the coverage they recorded at the head counts.
        if [ -n "$EVIDENCE" ] && "$ONUS" report --help | grep -q -- --evidence; then
          shopt -s nullglob globstar
          for f in $EVIDENCE; do args+=(--evidence "$f"); done
          shopt -u nullglob globstar
        fi
        # The tests that reach the change, run at both commits; older releases skip it.
        if [ "$BEHAVIOR" = true ]; then
          if "$ONUS" report --help | grep -q -- --behavior; then
            args+=(--behavior)
            [ -n "$BEHAVIOR_BUDGET" ] && args+=(--behavior-budget "$BEHAVIOR_BUDGET")
          else
            echo "::warning::This onus has no --behavior; the behavior diff is skipped."
          fi
        fi
        # Milliseconds; perl is on every GitHub runner, `date +%N` is not.
        ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time * 1000'; }
        status=0
        started=$(ms)
        if "$ONUS" report --help | grep -q -- --markdown-out; then
          # One run for both formats (0.4.1 and later).
          "$ONUS" report "${args[@]}" --format json --markdown-out "$out/onus-report.md" \
            --fail-on "$FAIL_ON" > "$out/onus-report.json" || status=$?
          finished=$(ms)
        else
          "$ONUS" report "${args[@]}" --format md > "$out/onus-report.md"
          finished=$(ms)
          "$ONUS" report "${args[@]}" --format json --fail-on "$FAIL_ON" > "$out/onus-report.json" || status=$?
        fi
        if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
          exit "$status"
        fi
        cat "$out/onus-report.md" >> "$GITHUB_STEP_SUMMARY"
        summary=$(jq -c .summary "$out/onus-report.json")
        # The Phase 1 measures for this report (PLAN.md 5.10), one JSON line.
        jq -c \
          --arg repo "$REPO" --arg pr "$PR" --arg base "$BASE" --arg head "$HEAD" \
          --arg version "$VERSION" --argjson ms "$((finished - started))" '
          {
            schema: 1, repo: $repo, pr: ($pr | tonumber? // null), base: $base, head: $head,
            onus: $version, durationMs: $ms,
            files: .textStats.files,
            changedLines: (.textStats.linesAdded + .textStats.linesRemoved),
            rows: .summary.meaningChanges,
            needsAttention: .summary.needsAttention,
            secrets: .summary.secrets,
            ruleViolations: .summary.newRuleViolations,
            intentMismatches: .summary.intentMismatches,
            coverage: (.coverage | if . then {changed, ran} else null end)
          }' "$out/onus-report.json" > "$out/onus-metrics.json"
        {
          echo "report=$out/onus-report.json"
          echo "markdown=$out/onus-report.md"
          echo "meaning-changes=$(jq .meaningChanges <<< "$summary")"
          echo "needs-attention=$(jq .needsAttention <<< "$summary")"
          echo "metrics=$(cat "$out/onus-metrics.json")"
          echo "failed=$([ "$status" -eq 2 ] && echo true || echo false)"
        } >> "$GITHUB_OUTPUT"

    - name: Lane
      id: lane
      if: >-
        (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && github.event.action != 'closed' &&
        (inputs.lanes == 'true' || inputs.records == 'true')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ONUS: ${{ steps.install.outputs.onus }}
        REPORT: ${{ steps.report.outputs.report }}
        MD: ${{ steps.report.outputs.markdown }}
        CONFIG: ${{ inputs.config }}
        RECORDS: ${{ inputs.records }}
        RECORDS_BRANCH: ${{ inputs.records-branch }}
        JUDGE: ${{ inputs.judge }}
        HELD_OUT: ${{ inputs.held-out }}
        EVIDENCE: ${{ inputs.evidence }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        CHANGE: ${{ github.repository }}#${{ github.event.pull_request.number }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_BODY: ${{ github.event.pull_request.body }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ "$RECORDS" = true ] && "$ONUS" ci --help > /dev/null 2>&1; then
          dir="$RUNNER_TEMP/onus-records"
          out="$RUNNER_TEMP/onus/ci"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/onus/pr-body.md"
          # The report step pulled them already, with releases that keep signals.
          if [ ! -d "$dir" ]; then
            "$ONUS" ci records pull --dir "$dir" --branch "$RECORDS_BRANCH"
          fi
          args=(--base "$BASE" --head "$HEAD" --change "$CHANGE" --branch "$BRANCH" --author "$AUTHOR"
            --body-file "$RUNNER_TEMP/onus/pr-body.md" --report "$REPORT" --records "$dir" --out "$out")
          [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
          [ "$JUDGE" = true ] && args+=(--judge)
          [ -n "$HELD_OUT" ] && args+=(--held-out "$HELD_OUT")
          if [ -n "$EVIDENCE" ]; then
            shopt -s nullglob globstar
            for f in $EVIDENCE; do args+=(--evidence "$f"); done
          fi
          # The pull request's reviews, as GitHub has them; onus decides which
          # count. When they cannot be listed, none are passed and a human-lane
          # change keeps waiting.
          org=$(cut -d/ -f1 <<< "$REPO" | tr '[:upper:]' '[:lower:]')
          if "$ONUS" ci pr --help | grep -q -- --reviews; then
            reviews="$RUNNER_TEMP/onus/reviews.json"
            if gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[]' > "$reviews.lines"; then
              # GitHub may send a null user (a deleted account) or commit.
              jq -s 'map({by: (.user.login // "ghost"), state: (.state // ""), commit: (.commit_id // ""),
                association: (.author_association // "NONE"),
                bot: (.user.type == "Bot"), at: ((.submitted_at // "1970-01-01T00:00:00Z") | fromdate)})' \
                "$reviews.lines" > "$reviews"
              # Who is in each owning team of this organisation, when the token
              # may read it (org members: read). Without it, onus counts anyone
              # with write access for those teams and says so. The owners are
              # the ones onus reads at the base commit.
              if "$ONUS" ci owners --help > /dev/null 2>&1; then
                owner_args=(--base "$BASE" --report "$REPORT")
                [ -n "$CONFIG" ] && owner_args+=(--config "$CONFIG")
                teams='{}'
                for team in $("$ONUS" ci owners "${owner_args[@]}" |
                    jq -r '.owners[] | select(startswith("@") and contains("/"))' | head -n 20 || true); do
                  [ "$(cut -d/ -f1 <<< "${team#@}" | tr '[:upper:]' '[:lower:]')" = "$org" ] || continue
                  slug=$(tr '[:upper:]' '[:lower:]' <<< "${team#*/}")
                  if members=$(gh api "orgs/$org/teams/$slug/members" --paginate --jq '.[].login' 2> /dev/null); then
                    teams=$(jq -c --arg t "$team" --arg m "$members" '. + {($t): ($m | split("\n") | map(select(. != "")))}' <<< "$teams")
                  else
                    echo "::notice::Cannot read the members of $team (the token needs org members: read); onus says how it counted."
                  fi
                done
                jq --argjson teams "$teams" '{reviews: ., teams: $teams}' "$reviews" > "$reviews.tmp"
                mv "$reviews.tmp" "$reviews"
              fi
              args+=(--reviews "$reviews")
            else
              echo "::warning::Cannot list the reviews of $CHANGE; a change in the human lane keeps waiting."
            fi
          fi
          summary=$("$ONUS" ci pr "${args[@]}")
          # Ask the owners onus names to review, each once per pull request:
          # @org/team of this organisation as a team, @login as a person, never
          # the author; emails and other organisations' teams are skipped. When
          # GitHub refuses the list, ask one at a time, so one name it refuses
          # (not a collaborator, or a team without access) does not cost the rest.
          request=$(jq -c --arg org "$org" --arg author "$AUTHOR" '
            [.review.request[]? | select(startswith("@")) | ltrimstr("@")] as $o
            | {reviewers: [$o[] | select((contains("/") | not) and ascii_downcase != ($author | ascii_downcase))],
               team_reviewers: [$o[] | select(contains("/")) | split("/") | select(.[0] | ascii_downcase == $org) | .[1] | ascii_downcase]}
            | .reviewers |= .[:15] | (15 - (.reviewers | length)) as $left
            | .team_reviewers |= .[:$left]' <<< "$summary")
          # onus has recorded them as asked either way, so a refused name is
          # not tried again on every push; the comment says GitHub refused it.
          refused=()
          if [ "$(jq '.reviewers + .team_reviewers | length' <<< "$request")" -gt 0 ] &&
            ! gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" --input - <<< "$request" > /dev/null 2>&1; then
            for one in $(jq -c --arg org "$org" '(.reviewers[] | {reviewers: [.], name: "@\(.)"}),
                (.team_reviewers[] | {team_reviewers: [.], name: "@\($org)/\(.)"})' <<< "$request"); do
              name=$(jq -r .name <<< "$one")
              if ! jq -c 'del(.name)' <<< "$one" |
                gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" --input - > /dev/null 2>&1; then
                echo "::warning::Cannot ask $name to review (not a collaborator, a team without access, or a read-only token on a fork?)."
                refused+=("$name")
              fi
            done
          fi
          if [ "${#refused[@]}" -gt 0 ]; then
            printf -v names '%s, ' "${refused[@]}"
            printf '\nGitHub would not ask %s to review: not a collaborator, a team without access, or a read-only token.\n' \
              "${names%, }" >> "$out/lane.md"
          fi
          # Pull requests from forks get a read-only token: classified, not recorded.
          "$ONUS" ci records push --dir "$dir" --branch "$RECORDS_BRANCH" --message "$CHANGE classified" ||
            echo "::warning::Cannot push the records to $RECORDS_BRANCH (a read-only token on a fork?)."
          cat "$out/lane.md" >> "$MD"
          cat "$out/lane.md" >> "$GITHUB_STEP_SUMMARY"
          echo "lane=$(jq -r .lane <<< "$summary")" >> "$GITHUB_OUTPUT"
          # Releases without reviews print no review: nothing waits.
          echo "review=$(jq -r 'if (.review.required // false) | not then ""
            elif .review.satisfied then "approved" else "waiting" end' <<< "$summary")" >> "$GITHUB_OUTPUT"
          if [ -f "$out/provenance.json" ]; then echo "provenance=$out/provenance.json" >> "$GITHUB_OUTPUT"; fi
          if [ -f "$out/rollout.json" ]; then
            echo "rollout-strategy=$(jq -r '.rollout.strategy // empty' <<< "$summary")" >> "$GITHUB_OUTPUT"
            echo "rollout-plan=$out/rollout.json" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi
        if ! "$ONUS" classify --help > /dev/null 2>&1; then
          echo "::notice::This Onus version has no lanes (0.7 and later)."
          exit 0
        fi
        args=(--report "$REPORT" --repo .)
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        "$ONUS" classify "${args[@]}" > "$RUNNER_TEMP/onus/onus-lane.json"
        lane=$(jq -r .lane "$RUNNER_TEMP/onus/onus-lane.json")
        why=$(jq -r --arg lane "$lane" '[.applied[] | select(.lane == $lane) | .reason] | join("; ")' "$RUNNER_TEMP/onus/onus-lane.json")
        line=$'\n'"**Lane:** \`$lane\`: $why"
        # Shown in the comment and in the job summary.
        printf '%s\n' "$line" >> "$MD"
        printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
        echo "lane=$lane" >> "$GITHUB_OUTPUT"
        if [ "$lane" = human ]; then
          echo "::notice::Onus put this change in the human lane. Without records: true nothing waits for a review (onus help ci)."
        fi

    - name: Apply the lane
      if: >-
        (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && inputs.apply-lane == 'true' &&
        steps.lane.outputs.lane != '' && github.event.pull_request.number &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LANE: ${{ steps.lane.outputs.lane }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        label="onus/lane:$LANE"
        gh label create "$label" --repo "$REPO" --force --color 5319e7 \
          --description "Onus risk lane" > /dev/null
        for old in $(gh pr view "$PR" --repo "$REPO" --json labels \
            --jq '.labels[].name | select(startswith("onus/lane:"))'); do
          [ "$old" = "$label" ] || gh pr edit "$PR" --repo "$REPO" --remove-label "$old" > /dev/null
        done
        gh pr edit "$PR" --repo "$REPO" --add-label "$label" > /dev/null

    - name: Auto-merge
      if: >-
        (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && inputs.auto-merge == 'true' &&
        steps.lane.outputs.lane == 'auto-merge' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: gh pr merge "$PR" --repo "$REPO" --auto --squash

    - name: Comment
      if: >-
        (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && github.event.action != 'closed' &&
        inputs.comment == 'true' && github.event.pull_request.number &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MD: ${{ steps.report.outputs.markdown }}
        METRICS: ${{ steps.report.outputs.metrics }}
        FEEDBACK: ${{ inputs.feedback }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # GitHub rejects comments over 65,536 characters.
        body=$(head -c 60000 "$MD")
        if [ "$(wc -c < "$MD")" -gt 60000 ]; then
          body+=$'\n\n…the report is longer than a comment allows; the full report is in the job summary.'
        fi
        if [ "$FEEDBACK" = true ]; then
          body+=$'\n\n<sub>Was this report useful? React with 👍 or 👎. If it surfaced something the diff hid, reply <code>/onus caught &lt;what&gt;</code>.</sub>'
        fi
        # Kept for scripts/onus-metrics.sh; invisible in the rendered comment.
        body+=$'\n<!-- onus-metrics '"$METRICS"$' -->'

        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- onus-report -->"))][0].id // empty' | head -n1)
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
        else
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
        fi

    - name: Fail on findings
      if: (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && steps.report.outputs.failed == 'true'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::Onus found: $FAIL_ON (see the report)"
        exit 2

    - name: Fail when blocked
      if: >-
        (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) && inputs.apply-lane == 'true' &&
        steps.lane.outputs.lane == 'blocked'
      shell: bash
      run: |
        echo "::error::Onus put this change in the blocked lane (see the report)"
        exit 2

    - name: Wait for a review
      if: >-
        (github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')) &&
        inputs.wait-for-review == 'true' && steps.lane.outputs.review == 'waiting'
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        echo "::error::Onus put this change in the human lane: it waits for an approving review of its head commit (see the report)"
        if [ "$EVENT" = pull_request ]; then
          echo "::notice::An approval updates this check only when the workflow also runs on pull_request_review (onus help ci)."
        fi
        exit 1

    - name: Re-run the pull request's check
      if: >-
        github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open' &&
        steps.lane.outputs.review == 'approved'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha }}
        WORKFLOW: ${{ github.workflow }}
      run: |
        set -euo pipefail
        # The pull_request run for this head failed while it waited; run it
        # again so its check passes too. This run's own check counts either
        # way, so failing to re-run is only a warning.
        if ! run=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --commit "$SHA" --event pull_request \
          --limit 1 --json databaseId,conclusion --jq '.[0] | select(.conclusion == "failure") | .databaseId'); then
          echo "::warning::Cannot list the pull request's runs (needs actions: read)."
        elif [ -n "$run" ]; then
          gh run rerun "$run" --repo "$REPO" || echo "::warning::Cannot re-run the check (needs actions: write)."
        fi

    - name: Record the outcome
      id: outcome
      if: github.event_name == 'pull_request' && github.event.action == 'closed' && inputs.records == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ONUS: ${{ steps.install.outputs.onus }}
        RECORDS_BRANCH: ${{ inputs.records-branch }}
        CHANGE: ${{ github.repository }}#${{ github.event.pull_request.number }}
        MERGED: ${{ github.event.pull_request.merged }}
        COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/onus-records"
        "$ONUS" ci records pull --dir "$dir" --branch "$RECORDS_BRANCH"
        args=(--change "$CHANGE" --records "$dir")
        if [ "$MERGED" = true ]; then args+=(--merged --commit "$COMMIT"); fi
        # Releases with provenance also know who merged it.
        provenance=false
        if "$ONUS" provenance --help > /dev/null 2>&1; then provenance=true; fi
        if [ "$provenance" = true ] && [ -n "$MERGED_BY" ]; then args+=(--merged-by "$MERGED_BY"); fi
        "$ONUS" ci closed "${args[@]}"
        "$ONUS" ci records push --dir "$dir" --branch "$RECORDS_BRANCH" --message "$CHANGE closed" ||
          echo "::warning::Cannot push the records to $RECORDS_BRANCH (a read-only token on a fork?)."
        if [ "$provenance" = true ]; then
          mkdir -p "$RUNNER_TEMP/onus"
          "$ONUS" provenance --change "$CHANGE" --records "$dir" --out "$RUNNER_TEMP/onus/provenance.json"
          echo "provenance=$RUNNER_TEMP/onus/provenance.json" >> "$GITHUB_OUTPUT"
        fi

    - name: /onus commands
      if: >-
        github.event_name == 'issue_comment' && inputs.records == 'true' &&
        github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/onus')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ONUS: ${{ steps.install.outputs.onus }}
        GH_TOKEN: ${{ inputs.github-token }}
        RECORDS_BRANCH: ${{ inputs.records-branch }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number }}
        CHANGE: ${{ github.repository }}#${{ github.event.issue.number }}
        COMMENT_ID: ${{ github.event.comment.id }}
        AUTHOR: ${{ github.event.comment.user.login }}
        ASSOCIATION: ${{ github.event.comment.author_association }}
        WORKFLOW: ${{ github.workflow }}
        # Through the environment, never pasted into the script.
        BODY: ${{ github.event.comment.body }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/onus-records"
        printf '%s' "$BODY" > "$RUNNER_TEMP/onus-comment.md"
        "$ONUS" ci records pull --dir "$dir" --branch "$RECORDS_BRANCH"
        answer=$("$ONUS" ci comment --change "$CHANGE" --body-file "$RUNNER_TEMP/onus-comment.md" \
          --author "$AUTHOR" --association "$ASSOCIATION" --records "$dir")
        command=$(jq -r '.command // empty' <<< "$answer")
        [ -z "$command" ] && exit 0
        # A caught from someone with write access is recorded, for the learned
        # lane model; the first step already reacted to it.
        if [ "$command" = caught ]; then
          if [ "$(jq -r '.recorded // false' <<< "$answer")" = true ]; then
            "$ONUS" ci records push --dir "$dir" --branch "$RECORDS_BRANCH" --message "$CHANGE: /onus caught by $AUTHOR" ||
              echo "::warning::Cannot push the records to $RECORDS_BRANCH (a read-only token on a fork?)."
          fi
          exit 0
        fi
        # An accuracy check is answered, not recorded: there is nothing to push.
        if [ "$command" = accuracy ]; then
          reaction=$([ "$(jq -r .ok <<< "$answer")" = true ] && echo '+1' || echo confused)
          gh api --method POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$reaction" > /dev/null
          reply=$(jq -r '.reply // empty' <<< "$answer")
          [ -n "$reply" ] && gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$reply" > /dev/null
          exit 0
        fi
        "$ONUS" ci records push --dir "$dir" --branch "$RECORDS_BRANCH" --message "$CHANGE: /onus $command by $AUTHOR"
        reaction=$([ "$(jq -r .ok <<< "$answer")" = true ] && echo '+1' || echo confused)
        gh api --method POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$reaction" > /dev/null
        reply=$(jq -r '.reply // empty' <<< "$answer")
        [ -n "$reply" ] && gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$reply" > /dev/null
        # After an approval, classify the pull request again by re-running its check.
        if [ "$(jq -r .rerun <<< "$answer")" = true ]; then
          sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          run=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --commit "$sha" --event pull_request \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty') ||
            echo "::warning::Cannot list the pull request's runs (needs actions: read); push to update the lane."
          if [ -n "${run:-}" ]; then
            gh run rerun "$run" --repo "$REPO" || echo "::warning::Cannot re-run the check (needs actions: write); push to update the lane."
          fi
        fi

    - name: Record reverts
      if: github.event_name == 'push' && inputs.records == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ONUS: ${{ steps.install.outputs.onus }}
        RECORDS_BRANCH: ${{ inputs.records-branch }}
        BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/onus-records"
        "$ONUS" ci records pull --dir "$dir" --branch "$RECORDS_BRANCH"
        args=(--records "$dir")
        # Only the commits this push added, when the push says which.
        if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
          args+=(--since "$BEFORE")
        fi
        "$ONUS" ci push "${args[@]}"
        "$ONUS" ci records push --dir "$dir" --branch "$RECORDS_BRANCH" --message "Reverts on ${GITHUB_REF_NAME}"

    - name: Rollout stage
      id: rollout
      if: inputs.records == 'true' && inputs.rollout-percent != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ONUS: ${{ steps.install.outputs.onus }}
        RECORDS_BRANCH: ${{ inputs.records-branch }}
        PERCENT: ${{ inputs.rollout-percent }}
        CHANGE: ${{ inputs.rollout-change }}
        METRICS: ${{ inputs.rollout-metrics }}
        DEPLOY: ${{ github.event.deployment.id }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/onus-records"
        "$ONUS" ci records pull --dir "$dir" --branch "$RECORDS_BRANCH"
        args=(--percent "$PERCENT" --records "$dir")
        case "$CHANGE" in
          *#*) args+=(--change "$CHANGE") ;;
          "") args+=(--commit "$GITHUB_SHA") ;;
          *) args+=(--commit "$CHANGE") ;;
        esac
        [ -n "$METRICS" ] && args+=(--metrics "$METRICS")
        [ -n "$DEPLOY" ] && args+=(--deploy "$DEPLOY")
        code=0
        decision=$("$ONUS" ci rollout "${args[@]}") || code=$?
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
        "$ONUS" ci records push --dir "$dir" --branch "$RECORDS_BRANCH" --message "Rollout at $PERCENT%"
        echo "rollout-decision=$(jq -r .decision <<< "$decision")" >> "$GITHUB_OUTPUT"
        echo "$decision" >> "$GITHUB_STEP_SUMMARY"
        if [ "$code" -eq 2 ]; then
          echo "::error::Onus decided to roll back: $(jq -r '.reasons | join("; ")' <<< "$decision")"
          exit 2
        fi
