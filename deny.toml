# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Every dependency must be under a license compatible with Apache-2.0.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error2 is unmaintained (not vulnerable). It reaches us only
  # through biscuit-quote, biscuit-auth's compile-time Datalog macros, which
  # cannot be turned off (biscuit-auth 6.0 does not build without them).
  # Revisit when biscuit-auth drops it.
  { id = "RUSTSEC-2026-0173", reason = "compile-time only, via biscuit-auth's required macros" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
